<!DOCTYPE html>
<html>

<head>
    <script>
        function validationForm() {
            var x = document.forms["myform"]["fname"].value;
            if (x == "") {
                alert("Name must be filled out");
                return false;
            }
        }
    </script>
</head>

<body>
    <form name="myForm" onsubmit="validationForm()">
        Name: <input type="text" name="fname">
        <input type="submit" value="Submit">
        <p id="message"></p>
    </form>
</body>

</html>
